# Legacy ECU Recovery - development graph (Graph A).
#
# Authority: docs/MASTER_SPEC.md. This file encodes the REQUIRED GRAPH from
# Appendix A, plus the dependencies stated in sections 24-26.
#
# A status of PASSED is the only thing that unlocks a dependent node. An edge
# means the prerequisite was verified, not that an agent reported done.
#
# UNVERIFIED-UNDER-GRAPH marks pre-graph code that exists but was never checked
# against its node contract. Those nodes still have to be executed; section 50
# step 8 forbids grandfathering them in.
#
# Two dependency statements in the specification disagree with Appendix A. Both
# readings are encoded, which is the conservative choice: a union of edges can
# never unlock a node earlier than either reading allows. See the notes below.

project:
  id: legacy-ecu-recovery
  version: "1.1"
  spec: docs/MASTER_SPEC.md

nodes:

  SPEC-001:
    title: Engineering foundation and project contract
    depends_on: []
    status: PASSED
    worker: coding-agent
    prompt: prompts/SPEC-001.md
    allowed_paths:
      - PROJECT.md
      - ARCHITECTURE.md
      - DECISIONS.md
      - TODO.md
      - EVALS.md
      - THREAT_MODEL.md
      - RESEARCH.md
    verification:
      type: human
    retry_budget: 1

  REPO-001:
    title: Reproducible Python engineering infrastructure
    depends_on:
      - SPEC-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/REPO-001.md
    allowed_paths:
      - pyproject.toml
      - src/ecu_recovery/**
      - tests/**
      - .github/workflows/**
    verification:
      type: commands
      commands:
        - uv run pytest
        - uv run ruff check .
        - uv run ruff format --check .
        - uv run mypy
    retry_budget: 2

  GRAPH-001:
    title: Development graph infrastructure
    depends_on:
      - REPO-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/GRAPH-001.md
    allowed_paths:
      - ecu-project.graph.yaml
      - graph/**
      - prompts/**
      - artifacts/**
      - tests/graph/**
      - TODO.md
      - ARCHITECTURE.md
    verification:
      type: commands
      commands:
        - uv run pytest
        - uv run ruff check .
        - uv run ruff format --check .
        - uv run mypy
    retry_budget: 2
    note: Passed 2026-08-17 after its amendment cleared GitHub CI and merged.

  DATA-001:
    title: Synthetic firmware laboratory
    depends_on:
      - GRAPH-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/DATA-001.md
    # Narrowed 2026-08-18. `tests/**` covered the whole test tree, including
    # tests/evidence/** and tests/graph/**, so it overlapped nodes that can be
    # READY at the same time.
    allowed_paths:
      - samples/**
      - scripts/**
      - tests/test_synthetic_lab.py
      - tests/samples/**
      - docs/synthetic-lab.md
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    note: Verified after PR #6; all eight required fixture categories present.

  RESEARCH-001:
    title: First ECU architecture research
    depends_on:
      - GRAPH-001
    status: PASSED
    worker: research-agent
    prompt: prompts/RESEARCH-001.md
    allowed_paths:
      - docs/research/**
    verification:
      type: human
    retry_budget: 2
    # Human gate cleared 2026-08-18. The node recommended candidates and did not
    # select, which is what its contract required; the selection is recorded in
    # DECISIONS.md as ADR-004: MPC5xx, 32-bit big-endian PowerPC. Emulator
    # availability decided it - SH-2 has the better public material but no
    # usable emulator, and TriCore combines four research problems at once.
    # Architecture selection only: no firmware, hardware, flashing, or emulation
    # is authorized by it.
    note: Passed 2026-08-18 at the human gate; ADR-004 selects MPC5xx PowerPC.

  EVIDENCE-001:
    title: Epistemic evidence data model
    depends_on:
      - GRAPH-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/EVIDENCE-001.md
    # Widened 2026-08-18. src/ecu_recovery/evidence/ is only a re-export shim;
    # the persistence this node must extend lives in store.py and models.py,
    # and its existing tests are in tests/test_store_report.py. report.py is
    # deliberately excluded: if it must change, that is an interface issue to
    # report for human review, not a silent edit.
    allowed_paths:
      - src/ecu_recovery/evidence/**
      - src/ecu_recovery/store.py
      - src/ecu_recovery/models.py
      - tests/evidence/**
      - tests/test_store_report.py
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #8 and #14. All six entities, every required hypothesis
    # field, and all five statuses are present; revisions preserve history,
    # evidence is immutable, relationships carry confidence and evidence
    # references, migration is additive and idempotent, and foreign keys are
    # enforced per connection. The audit found one real defect and PR #14 fixed
    # it: INSERT OR REPLACE resolves as delete-then-insert, so the BEFORE UPDATE
    # triggers never fired and belief could be rewritten in place. Every
    # append-only table now also carries a BEFORE INSERT guard.
    note: Verified after PR #8 and #14; append-only belief history holds under audit.

  GHIDRA-001:
    title: Deterministic PyGhidra static analysis
    # Appendix A requires DATA-001. Section 24 also lists REPO-001, which is
    # transitively satisfied but recorded explicitly for traceability.
    depends_on:
      - DATA-001
      - REPO-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/GHIDRA-001.md
    allowed_paths:
      - src/ecu_recovery/analysis/**
      - tests/analysis/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified against prompts/GHIDRA-001.md after PR #11: all eleven required
    # operations and five required models are present, analysis warnings are
    # exposed, and structural extraction is exact on all eight synthetic
    # fixtures. Structural means function discovery and call-graph recovery
    # only. Extraction accuracy is not measured here; that is EVAL-STATIC-001.
    note: Verified after PR #11; contract operations, models, and warnings satisfied.

  EVAL-STATIC-001:
    title: Hidden-ground-truth static evaluation
    # Appendix A requires GHIDRA-001. Section 25 also lists DATA-001.
    depends_on:
      - GHIDRA-001
      - DATA-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/EVAL-STATIC-001.md
    allowed_paths:
      - src/ecu_recovery/evaluation/**
      - artifacts/evals/**
      - tests/evaluation/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #13, with the reproducibility defect from PR #15 fixed:
    # binary import 8/8, serialization 8/8, function discovery recall 32/32 and
    # precision 32/32, call-edge recall 24/24, zero unexpected crashes. Every
    # required threshold passes. The recorded baseline re-derives byte for byte
    # from an unrelated checkout, which is what makes it evidence rather than a
    # snapshot. Constant recovery is 27/41 and is reported, not gated: a value
    # the compiler never emitted is a fixture property, not a tool failure.
    note: Verified after PR #13 and #15; static gate passes on all six thresholds.

  TOOLS-001:
    title: Bounded agent-facing analysis tools
    # Canonical, ruled 2026-08-17: EVAL-STATIC-001 only. GHIDRA-001 is already
    # transitive through it, and deterministic analysis must be measured before
    # it is exposed through the agent-facing tool layer.
    depends_on:
      - EVAL-STATIC-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/TOOLS-001.md
    allowed_paths:
      - src/ecu_recovery/tools/**
      - tests/tools/**
      - TOOL_DESIGN.md
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #18. All ten required tools are present, inputs and
    # outputs are schema-validated, responses are bounded with explicit
    # pagination and truncation, errors are structured values rather than
    # exceptions, and every result survives JSON so no engine object escapes.
    # A tool receives an open session and nothing else, so the layer has no
    # filesystem, shell, or network reach; bounds are imported from
    # analysis.base rather than restated. No LLM, MCP, emulation, symbolic
    # execution, or angr. 72 of the 83 tool tests need no Ghidra, so the
    # layer's own guarantees stay under test in CI.
    note: Verified after PR #18; ten bounded tools, schema-checked in both directions.

  INTEGRATION-STATIC-001:
    title: Static MVP integration
    depends_on:
      - TOOLS-001
      - EVIDENCE-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/INTEGRATION-STATIC-001.md
    allowed_paths:
      - artifacts/integration/**
      - tests/integration/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #20. Two fixtures were driven through every stage the
    # contract names, against merged upstream interfaces with nothing stubbed.
    # The deterministic half of the report re-derives byte for byte from a
    # fresh workspace, every evidence citation resolves, and no absolute path
    # or engine object reaches the artifact. Three interface findings were
    # reported rather than patched, which is what this node's contract asks
    # for: two in report.py, one in BinaryAnalysis. None blocks the flow, and
    # the report.py pair is why GATE-STATIC-MVP is held by human decision
    # rather than run as soon as it becomes graph-ready.
    note: Verified after PR #20; end-to-end flow proven, three findings reported.

  REPORT-001:
    title: Faithful epistemic reporting
    # The static gate certifies the human-facing report along with everything
    # else, so the report has to say what the evidence model actually knows
    # before the gate runs. INTEGRATION-STATIC-001 found that it does not.
    depends_on:
      - INTEGRATION-STATIC-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/REPORT-001.md
    # Three paths beyond report.py itself, all for the same reason: they pin the
    # broken behaviour on purpose, and fixing it inverts them.
    #
    # tests/test_store_report.py holds EVIDENCE-001's
    # test_report_does_not_yet_render_status_or_history, which asserts the
    # report says "Status: **inferred**" and contains neither the status nor the
    # change reason.
    #
    # tests/integration/** and artifacts/integration/** hold
    # INTEGRATION-STATIC-001's finding that the gap exists, plus the recorded
    # report listing it. That node wrote its findings as auto-detected checks
    # precisely so a fix would retire them, and it does: the flow now reports
    # one finding instead of three. Only the assertion pinning the gap's
    # presence and the committed artifact need updating. Amended 2026-08-18,
    # after implementation showed the first amendment had missed them.
    #
    # Both overlaps are safe: REPORT-001 is transitively downstream of
    # EVIDENCE-001 and directly downstream of INTEGRATION-STATIC-001, so it can
    # never run concurrently with either.
    allowed_paths:
      - src/ecu_recovery/report.py
      - tests/report/**
      - tests/test_store_report.py
      - tests/integration/**
      - artifacts/integration/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #23. Certainty and HypothesisStatus render as separate
    # concepts, all five statuses are distinguishable, and a belief that moved
    # carries its revision chain with the recorded reason. No schema change was
    # needed: the status and change_reason were already in the rows report_data
    # returns. The two nodes that pinned the defect had their assertions
    # inverted rather than deleted, so the record of what was wrong stays
    # legible, and the integration flow's auto-detected findings fell from
    # three to one on their own.
    note: Verified after PR #23; the report distinguishes belief from testing.

  GATE-STATIC-MVP:
    title: Static MVP gate
    # REPORT-001 added 2026-08-18. The gate certifies the static MVP, and the
    # engineering report is part of what it certifies; a report that cannot
    # distinguish a REJECTED belief from an UNTESTED one is not something to
    # certify first and repair afterwards.
    depends_on:
      - INTEGRATION-STATIC-001
      - REPORT-001
    status: PASSED
    worker: verification
    prompt: prompts/GATE-STATIC-MVP.md
    allowed_paths: []
    verification:
      type: gate
    retry_budget: 0
    # Run 2026-08-18 against merged main. All twelve required properties were
    # verified from live evidence rather than from earlier reports: fixture
    # artifact hashes re-checked against build.json, the evaluation re-run into
    # a fresh directory, the tool catalogue inspected, and evidence persistence
    # exercised including its append-only and tamper-resistance guards. Full
    # regression 556 passed with ruff, format, and mypy clean.
    #
    # The investigator-agent phase is unlocked but not authorized: AGENT-001,
    # HYPOTHESIS-001, EVAL-AGENT-001, and GATE-AGENT-MVP do not exist in this
    # graph yet and need their own amendment. Note that MASTER_SPEC's unlock
    # list names REPORT-001 for the agent-phase reporting node; that id is now
    # taken by the report repair, so the agent-phase node needs a different one.
    note: Passed 2026-08-18; all twelve static MVP properties verified.

  # --- investigator-agent phase ---
  #
  # Authorized 2026-08-18, after GATE-STATIC-MVP passed. Three nodes, not five.
  # MASTER_SPEC once listed HYPOTHESIS-001 and an agent-phase REPORT-001; the
  # first is unnecessary because EVIDENCE-001 already persists hypotheses with
  # revisions and evidence links, and the second cannot reuse that id because
  # the epistemic REPORT-001 has taken it. A reporting node can be named and
  # added later if it turns out to be needed.

  AGENT-001:
    title: Bounded investigator agent
    # Deliberately on the synthetic corpus and the existing tool registry. A new
    # architecture and a first agent at the same time would make every failure
    # ambiguous: a wrong answer could be the model or the unfamiliar target, and
    # there would be no way to tell which. MPC5xx data work is its own step.
    depends_on:
      - GATE-STATIC-MVP
    status: PASSED
    worker: coding-agent
    prompt: prompts/AGENT-001.md
    allowed_paths:
      - src/ecu_recovery/agent/**
      - tests/agent/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #29. Facts are gathered through ToolRegistry before any
    # model is involved and the model is handed those facts rather than tools,
    # so retrieval stays deterministic and a wrong answer is attributable to
    # interpretation. Citations are checked by replaying the recorded call and
    # comparing a digest of the result, not its exit status; every citation on a
    # factual claim must survive or the claim is demoted to unknown with the
    # demotion recorded. No model-authored claim reaches Certainty.KNOWN, and
    # evidence identity is content-derived so a shifted ordinal cannot make one
    # observation impersonate another. Review found five defects across two
    # rounds; all five are fixed and pinned by tests.
    note: Verified after PR #29; a model interprets, and every claim it makes is checked.

  EVAL-AGENT-001:
    title: Deterministic agent evaluation
    depends_on:
      - AGENT-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/EVAL-AGENT-001.md
    # Subtrees of EVAL-STATIC-001's paths. The overlap is ordered and therefore
    # safe: this node is transitively downstream of that one, so the two can
    # never run concurrently.
    allowed_paths:
      - src/ecu_recovery/evaluation/agent/**
      - tests/evaluation/agent/**
      - artifacts/evals/agent/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #32. The deterministic evaluator is complete: frozen
    # transcript plus hidden ground truth yields metrics, with numerator and
    # denominator on every rate, reproducible for a fixed transcript, and no
    # model judging anything ground truth can decide.
    #
    # What it has measured and what it has not are different things, and the
    # distinction is the reason GATE-AGENT-MVP is still shut. The corpus holds
    # real tool output through the real agent, so the evidential machinery -
    # citation validity, schema compliance, unsupported claims, tool
    # hallucination - was measured on genuine agent behaviour. Only the model's
    # reply was scripted, so nothing here is a baseline of a model, and the
    # corpus is adversarial by construction: the gate fails over it on purpose.
    #
    # Semantic metrics stay unmeasured pending two blinded human reviewers.
    # Authored labels compute them to verify the scorer and are marked as such.
    note: Verified after PR #32; the evaluator is complete, a model baseline is not.

  PROVIDER-001:
    title: OpenAI provider transport
    # Transport only: ModelRequest in, ModelResponse out. It does not capture,
    # freeze, or score anything - BASELINE-AGENT-001 owns transcript capture,
    # and keeping the two apart means a transport failure and a bad answer are
    # never the same incident.
    depends_on:
      - EVAL-AGENT-001
    status: PENDING
    worker: coding-agent
    prompt: prompts/PROVIDER-001.md
    # Its own tree, deliberately outside src/ecu_recovery/agent/**. AGENT-001
    # owns the protocol and the bounded reasoning path and is already verified;
    # a provider must not be able to reach into it. pyproject.toml is here for
    # one line, the optional `openai` extra, so the default install and the
    # whole suite stay free of it exactly as they are of Ghidra.
    allowed_paths:
      - src/ecu_recovery/providers/openai/**
      - tests/providers/openai/**
      - pyproject.toml
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    note: One completion request in, text out. No tools, no streaming, no storage.

  BASELINE-AGENT-001:
    title: First real-model baseline transcripts
    # Experiment execution. Runs the existing agent over all eight fixtures with
    # the OpenAI provider and freezes what comes back. It may not adjudicate its
    # own output; that is REVIEW-AGENT-BASELINE-001, and the separation is what
    # stops the thing being measured from grading itself.
    depends_on:
      - PROVIDER-001
    status: PENDING
    worker: coding-agent
    prompt: prompts/BASELINE-AGENT-001.md
    # Outside EVAL-AGENT-001's artifacts and tests, so a real baseline can never
    # be confused with the authored fixtures that verify the scorer.
    allowed_paths:
      - artifacts/agent-baseline/transcripts/**
      - artifacts/agent-baseline/results/**
      - tests/agent_baseline/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    note: All eight fixtures. Commit the poor answers too; a curated baseline is none.

  REVIEW-AGENT-BASELINE-001:
    title: Blinded human review of the baseline
    # The human gate the semantic metrics have been waiting for. Two distinct
    # reviewers, submitting independently, without seeing each other's verdicts.
    #
    # `verification: human` is the graph's existing representation and its
    # meaning is already recorded in graph/models.py: an agent must never
    # self-approve one. A coding agent may prepare material for reviewers and
    # may never file a review; if the two reviews do not exist this node reaches
    # NEEDS_HUMAN, which is a real status in the state machine, rather than
    # PASSED.
    depends_on:
      - BASELINE-AGENT-001
    status: PENDING
    worker: human-reviewers
    prompt: prompts/REVIEW-AGENT-BASELINE-001.md
    allowed_paths:
      - artifacts/agent-baseline/reviews/**
    verification:
      type: human
    retry_budget: 2
    note: Two blinded reviewers. Authored labels never count; disagreement stays explicit.

  GATE-AGENT-MVP:
    title: Agent MVP gate
    # REVIEW-AGENT-BASELINE-001 added 2026-08-19. Generating a real transcript
    # is not the same as having it judged, and the gate needs both: the semantic
    # metrics are unmeasured until two blinded reviewers reach field-level
    # quorum. EVAL-AGENT-001 stays an explicit prerequisite because the gate
    # certifies the measurement machinery as well as the measurement.
    #
    # Without this edge the gate could fire on the authored corpus and certify a
    # measurement of nothing: every model reply there is scripted, and the
    # evaluator reports sufficient_for_GATE-AGENT-MVP=False for that reason.
    depends_on:
      - EVAL-AGENT-001
      - REVIEW-AGENT-BASELINE-001
    status: PENDING
    worker: verification
    prompt: prompts/GATE-AGENT-MVP.md
    allowed_paths: []
    verification:
      type: gate
    retry_budget: 0
    note: Blocks emulation and real-firmware work until it passes.
