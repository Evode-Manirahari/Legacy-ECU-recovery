# Legacy ECU Recovery - development graph (Graph A).
#
# Authority: docs/MASTER_SPEC.md. This file encodes the REQUIRED GRAPH from
# Appendix A, plus the dependencies stated in sections 24-26.
#
# A status of PASSED is the only thing that unlocks a dependent node. An edge
# means the prerequisite was verified, not that an agent reported done.
#
# UNVERIFIED-UNDER-GRAPH marks pre-graph code that exists but was never checked
# against its node contract. Those nodes still have to be executed; section 50
# step 8 forbids grandfathering them in.
#
# Two dependency statements in the specification disagree with Appendix A. Both
# readings are encoded, which is the conservative choice: a union of edges can
# never unlock a node earlier than either reading allows. See the notes below.

project:
  id: legacy-ecu-recovery
  version: "1.1"
  spec: docs/MASTER_SPEC.md

nodes:

  SPEC-001:
    title: Engineering foundation and project contract
    depends_on: []
    status: PASSED
    worker: coding-agent
    prompt: prompts/SPEC-001.md
    allowed_paths:
      - PROJECT.md
      - ARCHITECTURE.md
      - DECISIONS.md
      - TODO.md
      - EVALS.md
      - THREAT_MODEL.md
      - RESEARCH.md
    verification:
      type: human
    retry_budget: 1

  REPO-001:
    title: Reproducible Python engineering infrastructure
    depends_on:
      - SPEC-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/REPO-001.md
    allowed_paths:
      - pyproject.toml
      - src/ecu_recovery/**
      - tests/**
      - .github/workflows/**
    verification:
      type: commands
      commands:
        - uv run pytest
        - uv run ruff check .
        - uv run ruff format --check .
        - uv run mypy
    retry_budget: 2

  GRAPH-001:
    title: Development graph infrastructure
    depends_on:
      - REPO-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/GRAPH-001.md
    allowed_paths:
      - ecu-project.graph.yaml
      - graph/**
      - prompts/**
      - artifacts/**
      - tests/graph/**
      - TODO.md
      - ARCHITECTURE.md
    verification:
      type: commands
      commands:
        - uv run pytest
        - uv run ruff check .
        - uv run ruff format --check .
        - uv run mypy
    retry_budget: 2
    note: Passed 2026-08-17 after its amendment cleared GitHub CI and merged.

  DATA-001:
    title: Synthetic firmware laboratory
    depends_on:
      - GRAPH-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/DATA-001.md
    # Narrowed 2026-08-18. `tests/**` covered the whole test tree, including
    # tests/evidence/** and tests/graph/**, so it overlapped nodes that can be
    # READY at the same time.
    allowed_paths:
      - samples/**
      - scripts/**
      - tests/test_synthetic_lab.py
      - tests/samples/**
      - docs/synthetic-lab.md
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    note: Verified after PR #6; all eight required fixture categories present.

  RESEARCH-001:
    title: First ECU architecture research
    depends_on:
      - GRAPH-001
    status: PENDING
    worker: research-agent
    prompt: prompts/RESEARCH-001.md
    allowed_paths:
      - docs/research/**
    verification:
      type: human
    retry_budget: 2
    note: Recommends candidates only. Target selection is a human gate.

  EVIDENCE-001:
    title: Epistemic evidence data model
    depends_on:
      - GRAPH-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/EVIDENCE-001.md
    # Widened 2026-08-18. src/ecu_recovery/evidence/ is only a re-export shim;
    # the persistence this node must extend lives in store.py and models.py,
    # and its existing tests are in tests/test_store_report.py. report.py is
    # deliberately excluded: if it must change, that is an interface issue to
    # report for human review, not a silent edit.
    allowed_paths:
      - src/ecu_recovery/evidence/**
      - src/ecu_recovery/store.py
      - src/ecu_recovery/models.py
      - tests/evidence/**
      - tests/test_store_report.py
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #8 and #14. All six entities, every required hypothesis
    # field, and all five statuses are present; revisions preserve history,
    # evidence is immutable, relationships carry confidence and evidence
    # references, migration is additive and idempotent, and foreign keys are
    # enforced per connection. The audit found one real defect and PR #14 fixed
    # it: INSERT OR REPLACE resolves as delete-then-insert, so the BEFORE UPDATE
    # triggers never fired and belief could be rewritten in place. Every
    # append-only table now also carries a BEFORE INSERT guard.
    note: Verified after PR #8 and #14; append-only belief history holds under audit.

  GHIDRA-001:
    title: Deterministic PyGhidra static analysis
    # Appendix A requires DATA-001. Section 24 also lists REPO-001, which is
    # transitively satisfied but recorded explicitly for traceability.
    depends_on:
      - DATA-001
      - REPO-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/GHIDRA-001.md
    allowed_paths:
      - src/ecu_recovery/analysis/**
      - tests/analysis/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified against prompts/GHIDRA-001.md after PR #11: all eleven required
    # operations and five required models are present, analysis warnings are
    # exposed, and structural extraction is exact on all eight synthetic
    # fixtures. Structural means function discovery and call-graph recovery
    # only. Extraction accuracy is not measured here; that is EVAL-STATIC-001.
    note: Verified after PR #11; contract operations, models, and warnings satisfied.

  EVAL-STATIC-001:
    title: Hidden-ground-truth static evaluation
    # Appendix A requires GHIDRA-001. Section 25 also lists DATA-001.
    depends_on:
      - GHIDRA-001
      - DATA-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/EVAL-STATIC-001.md
    allowed_paths:
      - src/ecu_recovery/evaluation/**
      - artifacts/evals/**
      - tests/evaluation/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #13, with the reproducibility defect from PR #15 fixed:
    # binary import 8/8, serialization 8/8, function discovery recall 32/32 and
    # precision 32/32, call-edge recall 24/24, zero unexpected crashes. Every
    # required threshold passes. The recorded baseline re-derives byte for byte
    # from an unrelated checkout, which is what makes it evidence rather than a
    # snapshot. Constant recovery is 27/41 and is reported, not gated: a value
    # the compiler never emitted is a fixture property, not a tool failure.
    note: Verified after PR #13 and #15; static gate passes on all six thresholds.

  TOOLS-001:
    title: Bounded agent-facing analysis tools
    # Canonical, ruled 2026-08-17: EVAL-STATIC-001 only. GHIDRA-001 is already
    # transitive through it, and deterministic analysis must be measured before
    # it is exposed through the agent-facing tool layer.
    depends_on:
      - EVAL-STATIC-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/TOOLS-001.md
    allowed_paths:
      - src/ecu_recovery/tools/**
      - tests/tools/**
      - TOOL_DESIGN.md
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #18. All ten required tools are present, inputs and
    # outputs are schema-validated, responses are bounded with explicit
    # pagination and truncation, errors are structured values rather than
    # exceptions, and every result survives JSON so no engine object escapes.
    # A tool receives an open session and nothing else, so the layer has no
    # filesystem, shell, or network reach; bounds are imported from
    # analysis.base rather than restated. No LLM, MCP, emulation, symbolic
    # execution, or angr. 72 of the 83 tool tests need no Ghidra, so the
    # layer's own guarantees stay under test in CI.
    note: Verified after PR #18; ten bounded tools, schema-checked in both directions.

  INTEGRATION-STATIC-001:
    title: Static MVP integration
    depends_on:
      - TOOLS-001
      - EVIDENCE-001
    status: PASSED
    worker: coding-agent
    prompt: prompts/INTEGRATION-STATIC-001.md
    allowed_paths:
      - artifacts/integration/**
      - tests/integration/**
    verification:
      type: commands
      commands:
        - uv run pytest
    retry_budget: 2
    # Verified after PR #20. Two fixtures were driven through every stage the
    # contract names, against merged upstream interfaces with nothing stubbed.
    # The deterministic half of the report re-derives byte for byte from a
    # fresh workspace, every evidence citation resolves, and no absolute path
    # or engine object reaches the artifact. Three interface findings were
    # reported rather than patched, which is what this node's contract asks
    # for: two in report.py, one in BinaryAnalysis. None blocks the flow, and
    # the report.py pair is why GATE-STATIC-MVP is held by human decision
    # rather than run as soon as it becomes graph-ready.
    note: Verified after PR #20; end-to-end flow proven, three findings reported.

  GATE-STATIC-MVP:
    title: Static MVP gate
    depends_on:
      - INTEGRATION-STATIC-001
    status: PENDING
    worker: verification
    prompt: prompts/GATE-STATIC-MVP.md
    allowed_paths: []
    verification:
      type: gate
    retry_budget: 0
    note: Blocks all investigator-agent work until it passes.
