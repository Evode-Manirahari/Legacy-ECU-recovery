[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "legacy-ecu-recovery"
version = "0.1.0"
description = "Evidence-backed analysis of undocumented legacy ECU firmware"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Legacy ECU Recovery contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
ecu-recovery = "ecu_recovery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecu_recovery"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
