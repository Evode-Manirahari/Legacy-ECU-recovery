[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legacy-ecu-recovery"
version = "0.1.0"
description = "Evidence-backed analysis of undocumented legacy ECU firmware"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Legacy ECU Recovery contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ecu-recovery = "ecu_recovery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecu_recovery"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
