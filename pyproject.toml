[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "legacy-ecu-recovery"
version = "0.1.0"
description = "Evidence-backed analysis of undocumented legacy ECU firmware"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Legacy ECU Recovery contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
# Ghidra-backed static analysis. Optional because the deterministic models,
# adapter interface, and serialization must remain testable on a host that has
# no Ghidra installation. See docs/ghidra-integration.md.
ghidra = [
  "pyghidra>=2.2,<3",
]
# The OpenAI transport that captures the agent baseline. Optional for the same
# reason Ghidra is: the agent, the evaluator, and every test around them must
# stay runnable on a host with no account, no key, and nothing installed.
openai = [
  "openai>=3.3,<4",
]

[project.scripts]
ecu-recovery = "ecu_recovery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecu_recovery"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# "." puts the repository root on the path so the top-level `graph/`
# development package imports without per-test bootstrapping.
pythonpath = ["src", "."]
# Ghidra tests run by default and skip themselves with a reason when Ghidra or
# PyGhidra is missing. Opt out of the slow JVM path with `-m "not ghidra"`.
markers = [
  "ghidra: requires a local Ghidra installation and PyGhidra",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
# `graph` is development scaffolding rather than shipped code, but it decides
# what work may start, so it is type-checked to the same standard.
files = ["src", "tests", "graph"]
pretty = true
show_error_codes = true

# Ghidra's API is Java reached through JPype, and PyGhidra ships no type
# information. These are untyped by nature, so the boundary that touches them
# (analysis/ghidra.py) is responsible for converting to typed plain records.
[[tool.mypy.overrides]]
module = ["pyghidra.*", "ghidra.*", "jpype.*", "java.*"]
ignore_missing_imports = true

# The openai extra is not installed for type checking: CI syncs `dev` only, so
# the SDK is absent exactly as it is for a contributor with no account. Unlike
# Ghidra this is not a typing gap - openai ships its own types - so what is
# ignored is the module being missing, not the module being untyped. The
# adapter converts to plain records at the boundary regardless, so no
# vendor-shaped object reaches the rest of the project.
[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true
